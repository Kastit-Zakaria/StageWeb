<!DOCTYPE html>
<html lang="fr" xmlns="http://www.w3.org/1999/xhtml" xmlns:th="http://www.thymeleaf.org">
    <head>
        <title>Stage Management System</title>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.0/dist/css/bootstrap.min.css"
              integrity="sha384-KyZXEAg3QhqLMpG8r+8fhAXLRk2vvoC2f3B09zVXn8CA5QIVfZOJ3BCsw2P0p/We"
              crossorigin="anonymous"/>
    </head>
    <body>
        <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
            <div class="container-fluid">
                <a class="navbar-brand" href="#">Stage Management</a>
                <div class="collapse navbar-collapse">
                    <ul class="navbar-nav me-auto">
                        <li class="nav-item">
                            <a class="nav-link" th:href="@{/enfants}">Enfants</a>
                        </li>
                        <li class="nav-item">
                            <a class="nav-link" th:href="@{/stages}">Stages</a>
                        </li>
                        <li class="nav-item">
                            <a class="nav-link" th:href="@{/inscriptions}">Inscriptions</a>
                        </li>
                    </ul>
                </div>
            </div>
        </nav>
        <div class="container">
            <h2>Nouvel Enfant</h2>
            <hr />
            <form action="#" th:action="@{/saveNewEnfant}" th:object="${enfant}" method="POST"><br>
                <span>Nom :</span><br>
                <input type="text" th:field="*{nom}" placeholder="Nom" class="form-control" />
                <span th:if="${#fields.hasErrors('nom')}" th:errors="*{nom}" class="text-danger"></span><br>
                <span>Prénom :</span><br>
                <input type="text" th:field="*{prenom}" placeholder="Prénom" class="form-control" />
                <span th:if="${#fields.hasErrors('prenom')}" th:errors="*{prenom}" class="text-danger"></span><br>
                <span>Date de naissance :</span><br>
                <input type="date" th:field="*{dateNaissance}" class="form-control" />
                <span th:if="${#fields.hasErrors('dateNaissance')}" th:errors="*{dateNaissance}" class="text-danger"></span><br>
                <span>Sexe :</span><br>
                <select th:field="*{sexe}" class="form-control">
                    <option value="M">M</option>
                    <option value="F">F</option>
                </select>
                <span th:if="${#fields.hasErrors('sexe')}" th:errors="*{sexe}" class="text-danger"></span>
                <br>
                <button type="submit" class="btn btn-info col-2 mt-2">Save</button>
            </form>
            <hr />
            <a th:href="@{/enfants}">Back to Enfant List</a>
        </div>
    </body>
</html>
