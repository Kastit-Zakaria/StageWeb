<!DOCTYPE html>
<html lang="fr" xmlns="http://www.w3.org/1999/xhtml" xmlns:th="http://www.thymeleaf.org">
    <head>
        <title>Stage Management System</title>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.0/dist/css/bootstrap.min.css"
              integrity="sha384-KyZXEAg3QhqLMpG8r+8fhAXLRk2vvoC2f3B09zVXn8CA5QIVfZOJ3BCsw2P0p/We"
              crossorigin="anonymous"/>
    </head>
    <body>
        <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
            <div class="container-fluid">
                <a class="navbar-brand" href="#">Stage Management</a>
                <div class="collapse navbar-collapse">
                    <ul class="navbar-nav me-auto">
                        <li class="nav-item">
                            <a class="nav-link" th:href="@{/enfants}">Enfants</a>
                        </li>
                        <li class="nav-item">
                            <a class="nav-link" th:href="@{/stages}">Stages</a>
                        </li>
                        <li class="nav-item">
                            <a class="nav-link" th:href="@{/inscriptions}">Inscriptions</a>
                        </li>
                    </ul>
                </div>
            </div>
        </nav>
        <div class="container my-2">
            <h1>Liste des Inscriptions</h1>
            <a th:href="@{/showNewInscriptionForm}" class="btn btn-primary btn-sm mb-3">Add Inscription</a>
            <table class="table table-striped">
                <thead>
                    <tr>
                        <th>Enfant</th>
                        <th>Stage</th>
                        <th>Payé</th>
                        <th>Actions</th>
                    </tr>
                </thead>
                <tbody>
                    <tr th:each="inscription : ${listInscriptions}">
                        <td th:text="${inscription.enfant.prenom + ' ' + inscription.enfant.nom}"></td>
                        <td th:text="${inscription.stage.denom}"></td>
                        <td th:text="${inscription.paye}"></td>
                        <td>
                            <a th:href="@{/showUpdateInscriptionForm(id=${inscription.id})}" class="btn btn-primary">Update</a>
                            <a th:href="@{/deleteInscription(id=${inscription.id})}" class="btn btn-danger">Delete</a>
                        </td>
                    </tr>
                </tbody>
            </table>
        </div>
    </body>
</html>
