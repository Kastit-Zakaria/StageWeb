<!DOCTYPE html>
<html lang="fr" xmlns="http://www.w3.org/1999/xhtml" xmlns:th="http://www.thymeleaf.org">
    <head>
        <title>Stage Management System</title>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.0/dist/css/bootstrap.min.css"
              integrity="sha384-KyZXEAg3QhqLMpG8r+8fhAXLRk2vvoC2f3B09zVXn8CA5QIVfZOJ3BCsw2P0p/We"
              crossorigin="anonymous"/>
    </head>
    <body>
        <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
            <div class="container-fluid">
                <a class="navbar-brand" href="#">Stage Management</a>
                <div class="collapse navbar-collapse">
                    <ul class="navbar-nav me-auto">
                        <li class="nav-item">
                            <a class="nav-link" th:href="@{/enfants}">Enfants</a>
                        </li>
                        <li class="nav-item">
                            <a class="nav-link" th:href="@{/stages}">Stages</a>
                        </li>
                        <li class="nav-item">
                            <a class="nav-link" th:href="@{/inscriptions}">Inscriptions</a>
                        </li>
                    </ul>
                </div>
            </div>
        </nav>
        <div class="container">
            <h2>Nouveau Stage</h2>
            <hr />
            <form action="#" th:action="@{/saveNewStage}" th:object="${stage}" method="POST"><br>
                <span>Dénomination :</span>
                <input type="text" th:field="*{denom}" placeholder="Dénomination" class="form-control" />
                <span th:if="${#fields.hasErrors('denom')}" th:errors="*{denom}" class="text-danger"></span><br>
                <span>Age min :</span>
                <input type="number" th:field="*{ageMin}" placeholder="Age Min" class="form-control" />
                <span th:if="${#fields.hasErrors('ageMin')}" th:errors="*{ageMin}" class="text-danger"></span><br>
                <span>Age max :</span>
                <input type="number" th:field="*{ageMax}" placeholder="Age Max" class="form-control" />
                <span th:if="${#fields.hasErrors('ageMax')}" th:errors="*{ageMax}" class="text-danger"></span><br>
                <span>Date début :</span>
                <input type="date" th:field="*{dateDeb}" class="form-control" />
                <span th:if="${#fields.hasErrors('dateDeb')}" th:errors="*{dateDeb}" class="text-danger"></span><br>
                <span>Date fin :</span>
                <input type="date" th:field="*{dateFin}" class="form-control" />
                <span th:if="${#fields.hasErrors('dateFin')}" th:errors="*{dateFin}" class="text-danger"></span><br>
                <span>Prix :</span>
                <input type="number" th:field="*{prix}" placeholder="Prix" class="form-control" />
                <span th:if="${#fields.hasErrors('prix')}" th:errors="*{prix}" class="text-danger"></span>
                <p th:if="${erreurAge}" th:text="${erreurAge}" class="text-danger"></p>
                <p th:if="${erreurDate}" th:text="${erreurDate}" class="text-danger"></p><br>
                <button type="submit" class="btn btn-info col-2 mt-2">Save</button>
            </form>
            <hr />
            <a th:href="@{/stages}">Back to Stage List</a>
        </div>
    </body>
</html>
